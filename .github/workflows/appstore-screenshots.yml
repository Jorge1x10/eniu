name: App Store Screenshots

# Corre a mano: compila un build de simulador de iOS con EAS, lo instala en
# un simulador de iPhone 16 Pro Max (la resolución de 6.9" que pide Apple) y
# usa Maestro para loguearse con la cuenta demo y capturar cada pantalla en
# español e inglés. También graba un App Preview (video corto) del recorrido
# en español para la misma sección de App Store Connect.
#
# Secrets que necesita este repo (Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN               token de acceso de Expo (eas.dev -> Access tokens)
#   EXPO_SCREENSHOT_EMAIL    correo de la cuenta demo con negocio y menú cargados
#   EXPO_SCREENSHOT_PASSWORD contraseña de esa cuenta demo
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID de un build de EAS (perfil ios-simulator) a reutilizar. Vacío = dispara uno nuevo."
        required: false
        type: string

jobs:
  screenshots:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile/eniu-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/eniu-mobile/package-lock.json

      - name: Instalar dependencias del proyecto
        # eas-cli evalúa app.json localmente (resuelve el plugin de
        # expo-router) para comandos como build:view, así que sin esto
        # falla con "Failed to resolve plugin for module expo-router".
        run: npm ci

      - name: Instalar EAS CLI y Maestro
        run: |
          npm install -g eas-cli
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Obtener build de simulador
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # eas-cli mete texto fuera de JSON en stdout si no detecta un entorno
          # de CI (avisos de versión, prompts saltados, etc.), lo que rompe
          # cualquier pipe directo a jq.
          CI: "true"
        run: |
          set -euo pipefail

          echo "----- eas whoami (verifica que EXPO_TOKEN autentica) -----"
          eas whoami

          if [ -n "${{ inputs.build_id }}" ]; then
            BUILD_ID="${{ inputs.build_id }}"
          else
            eas build --platform ios --profile ios-simulator --non-interactive --wait --json > new-build.json
            BUILD_ID=$(jq -r '.[0].id' new-build.json)
          fi

          set +e
          eas build:view "$BUILD_ID" --json > build-view.json 2> build-view.stderr.log
          STATUS=$?
          set -e
          echo "----- eas build:view stdout -----"
          cat build-view.json || true
          echo "----- eas build:view stderr -----"
          cat build-view.stderr.log || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::'eas build:view $BUILD_ID' salió con código $STATUS (ver stdout/stderr arriba)."
            exit "$STATUS"
          fi

          URL=$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl' build-view.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No se pudo obtener la URL de descarga del build $BUILD_ID (ver salida de 'eas build:view' arriba)."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Descargar y descomprimir el .app
        run: |
          set -euo pipefail
          curl -L "${{ steps.build.outputs.download_url }}" -o build.tar.gz
          mkdir -p build
          tar -xzf build.tar.gz -C build
          echo "APP_PATH=$(find build -maxdepth 2 -name '*.app' | head -1)" >> "$GITHUB_ENV"

      - name: Crear simulador en español (es-MX)
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl create "Eniu Screenshots" "iPhone 16 Pro Max")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl spawn "$DEVICE_ID" defaults write "Apple Global Domain" AppleLanguages -array "es-MX"
          xcrun simctl spawn "$DEVICE_ID" defaults write "Apple Global Domain" AppleLocale -string "es_MX"
          xcrun simctl shutdown "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Instalar la app en el simulador
        run: xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Capturar pantallas con Maestro
        env:
          MAESTRO_EMAIL: ${{ secrets.EXPO_SCREENSHOT_EMAIL }}
          MAESTRO_PASSWORD: ${{ secrets.EXPO_SCREENSHOT_PASSWORD }}
        run: maestro --device "$DEVICE_ID" test .maestro/appstore-screenshots.yaml

      - name: Subir depuración de Maestro (si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore

      - name: Grabar App Preview
        env:
          MAESTRO_EMAIL: ${{ secrets.EXPO_SCREENSHOT_EMAIL }}
          MAESTRO_PASSWORD: ${{ secrets.EXPO_SCREENSHOT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p previews

          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 --force previews/app-preview-raw.mov &
          RECORD_PID=$!
          sleep 2 # le da tiempo al grabador a arrancar antes de navegar

          maestro --device "$DEVICE_ID" test .maestro/appstore-preview.yaml

          sleep 1 # respiro final antes de cortar
          kill -INT "$RECORD_PID"
          wait "$RECORD_PID" || true

          # Apple exige 30s como máximo para un App Preview; el recorte es
          # un límite de seguridad por si algún paso tarda más de lo normal,
          # no una edición real (el recorrido ya está pensado para durar
          # bastante menos).
          ffmpeg -y -i previews/app-preview-raw.mov -t 30 -c copy previews/app-preview-es.mov
          rm previews/app-preview-raw.mov

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: mobile/eniu-mobile/screenshots/*.png
          if-no-files-found: error

      - name: Subir App Preview
        uses: actions/upload-artifact@v4
        with:
          name: appstore-app-preview
          path: mobile/eniu-mobile/previews/*.mov
          if-no-files-found: error
